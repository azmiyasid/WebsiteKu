<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Partnership | AzmiYasid</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../mystyleweb.css">
        <link rel="stylesheet" href="mytombol%20css/formwa.css">
        <link rel="stylesheet" href="mytombol%20css/partnership.css">
        <script src="mytombol%20javascript/formwa.js"></script>
        <script src="mytombol%20javascript/partnership.js" defer></script>
    </head>
    <body>
        <main class="form-page">
            <a class="back-link" href="../">&larr; Back</a>
            <h1 class="form-title">Partnership</h1>
            <p class="form-sub">Fill in this form and your message will be prepared in WhatsApp.</p>
            <form class="wa-form" id="form-wa" novalidate>
                <div class="field">
                    <label for="nama">Name</label>
                    <input id="nama" name="nama" type="text" placeholder="Full name" autocomplete="off">
                </div>
                <div class="field">
                    <label for="brand">Brand/Company</label>
                    <input id="brand" name="brand" type="text" placeholder="Brand name" autocomplete="off">
                </div>
                <div class="field">
                    <label for="jenis">Type of partnership</label>
                    <input id="jenis" name="jenis" type="text" placeholder="Example: endorsement, collab content" autocomplete="off">
                </div>
                <div class="field">
                    <label for="kontak">Contact (email/WhatsApp)</label>
                    <input id="kontak" name="kontak" type="text" placeholder="Email or WhatsApp number" autocomplete="off">
                </div>
                <div class="field">
                    <label for="detail">Partnership details <span class="opt">(optional)</span></label>
                    <textarea id="detail" name="detail" placeholder="Briefly describe your plan"></textarea>
                </div>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                <button type="submit" class="send-btn" id="send-btn">SEND</button>
            </form>
        </main>
    </body>
</html>
