<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Freelance | AzmiYasid</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
        <link rel="icon" type="image" href="pictureicon/LOGO AY.jpg">
        <link rel="stylesheet" href="../mystyleweb.css">
        <link rel="stylesheet" href="mytombol%20css/formwa.css">
        <link rel="stylesheet" href="mytombol%20css/freelance.css">
        <script src="mytombol%20javascript/formwa.js"></script>
        <script src="mytombol%20javascript/freelance.js" defer></script>
    </head>
    <body>
        <main class="form-page">
            <a class="back-link" href="../">&larr; Back</a>
            <h1 class="form-title">Freelance</h1>
            <p class="form-sub">Choose a video editing plan and your message will be prepared in WhatsApp.</p>
            <form class="wa-form" id="form-wa" novalidate>
                <div class="field">
                    <label for="nama">Name</label>
                    <input id="nama" name="nama" type="text" placeholder="Full name" autocomplete="off">
                </div>
                <div class="field">
                    <label for="paket">Plan</label>
                    <select id="paket" name="paket">
                        <option value="">Choose a plan</option>
                        <option>Free Edit (Rp 0)</option>
                        <option>Pro Edit (Rp 100.000)</option>
                        <option>Perfect Edit (Rp 135.000)</option>
                    </select>
                </div>
                <div class="field">
                    <label for="durasi">Video duration (minutes)</label>
                    <input id="durasi" name="durasi" type="number" placeholder="Example: 3" autocomplete="off">
                </div>
                <div class="field">
                    <label for="kontak">Contact (email/WhatsApp)</label>
                    <input id="kontak" name="kontak" type="text" placeholder="Email or WhatsApp number" autocomplete="off">
                </div>
                <div class="field">
                    <label for="brief">Link to materials/brief <span class="opt">(optional)</span></label>
                    <input id="brief" name="brief" type="text" placeholder="Google Drive link, etc." autocomplete="off">
                </div>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                <button type="submit" class="send-btn" id="send-btn">SEND</button>
            </form>
        </main>
    </body>
</html>
