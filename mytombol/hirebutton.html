<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hire Me | AzmiYasid</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../mystyleweb.css">
        <link rel="stylesheet" href="mytombol%20css/formwa.css">
        <link rel="stylesheet" href="mytombol%20css/hirebutton.css">
        <script src="mytombol%20javascript/formwa.js"></script>
        <script src="mytombol%20javascript/hirebutton.js" defer></script>
    </head>
    <body>
        <main class="form-page">
            <a class="back-link" href="../">&larr; Back</a>
            <h1 class="form-title">Hire Me</h1>
            <p class="form-sub">Fill in this form and your message will be prepared in WhatsApp.</p>
            <form class="wa-form" id="form-wa" novalidate>
                <div class="field">
                    <label for="nama">Name</label>
                    <input id="nama" name="nama" type="text" placeholder="Full name" autocomplete="off">
                </div>
                <div class="field">
                    <label for="perusahaan">Company/Organization</label>
                    <input id="perusahaan" name="perusahaan" type="text" placeholder="Company name" autocomplete="off">
                </div>
                <div class="field">
                    <label for="posisi">Open position</label>
                    <input id="posisi" name="posisi" type="text" placeholder="Example: Video Editor" autocomplete="off">
                </div>
                <div class="field">
                    <label for="kontak">Contact (email/WhatsApp)</label>
                    <input id="kontak" name="kontak" type="text" placeholder="Email or WhatsApp number" autocomplete="off">
                </div>
                <div class="field">
                    <label for="pesan">Additional message <span class="opt">(optional)</span></label>
                    <textarea id="pesan" name="pesan" placeholder="Write a short message"></textarea>
                </div>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                <button type="submit" class="send-btn" id="send-btn">SEND</button>
            </form>
        </main>
    </body>
</html>
