<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hire Me | AzmiYasid</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../mystyleweb.css">
        <link rel="stylesheet" href="mytombol%20css/formwa.css">
        <link rel="stylesheet" href="mytombol%20css/hirebutton.css">
        <script src="mytombol%20javascript/formwa.js"></script>
        <script src="mytombol%20javascript/hirebutton.js" defer></script>
    </head>
    <body>
        <main class="form-page">
            <a class="back-link" href="../index.html">&larr; Kembali</a>
            <h1 class="form-title">Hire Me</h1>
            <p class="form-sub">Isi form ini, lalu pesanmu akan disiapkan di WhatsApp.</p>
            <form class="wa-form" id="form-wa" novalidate>
                <div class="field">
                    <label for="nama">Nama</label>
                    <input id="nama" name="nama" type="text" placeholder="Nama lengkap" autocomplete="off">
                </div>
                <div class="field">
                    <label for="perusahaan">Perusahaan/Instansi</label>
                    <input id="perusahaan" name="perusahaan" type="text" placeholder="Nama perusahaan" autocomplete="off">
                </div>
                <div class="field">
                    <label for="posisi">Posisi yang dibuka</label>
                    <input id="posisi" name="posisi" type="text" placeholder="Contoh: Video Editor" autocomplete="off">
                </div>
                <div class="field">
                    <label for="kontak">Kontak (email/WA)</label>
                    <input id="kontak" name="kontak" type="text" placeholder="email atau nomor WhatsApp" autocomplete="off">
                </div>
                <div class="field">
                    <label for="pesan">Pesan tambahan <span class="opt">(opsional)</span></label>
                    <textarea id="pesan" name="pesan" placeholder="Tulis pesan singkat"></textarea>
                </div>
                <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                <button type="submit" class="send-btn" id="send-btn">KIRIM</button>
            </form>
        </main>
    </body>
</html>
